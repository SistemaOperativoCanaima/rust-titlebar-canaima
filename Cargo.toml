[package]
name = "canaima-titlebar"
version = "0.1.0"
edition = "2021"
authors = ["Canaima GNU/Linux Team"]
description = "Barra de título GTK HeaderBar nativa personalizada para aplicaciones Canaima GNU/Linux"
license = "GPL-3.0-only"

[dependencies]
tauri = { version = "2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
gdk-pixbuf = "0.18"

